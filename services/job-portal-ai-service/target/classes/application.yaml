  spring:
    application:
      name: job-portal-ai-service

    profiles:
      active: dev

    datasource:
      url: jdbc:mysql://localhost:3306/job_portal_ai_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
      username: root
      password:
      driver-class-name: com.mysql.cj.jdbc.Driver

    jpa:
      hibernate:
        ddl-auto: update

      show-sql: false

      properties:
        hibernate:
          format_sql: true
          dialect: org.hibernate.dialect.MySQLDialect


  server:
    port: 5008

    servlet:
      context-path: /


  # ============================================================
  # Microservice URLs
  # ============================================================

  services:

    user:
      url: http://localhost:5001

    company:
      url: http://localhost:5002

    job:
      url: http://localhost:5003

    resume:
      url: http://localhost:5004

    application:
      url: http://localhost:5005


  # ============================================================
  # AI Configuration
  # ============================================================

  ai:

    matching:
      enabled: true

      weights:
        skills: 0.50
        experience: 0.20
        education: 0.10
        location: 0.10
        job-type: 0.10

    recommendations:
      max-results: 20
      minimum-score: 50.0


  # ============================================================
  # OpenAI Configuration
  # ============================================================

  openai:

    api-key: ${OPENAI_API_KEY}

    base-url: https://api.openai.com

    model: gpt-5



  # ============================================================
  # Logging
  # ============================================================

  logging:

    level:

      root: INFO

      com.emmzy: DEBUG

      org.springframework.web: INFO

      org.hibernate.SQL: WARN


  # ============================================================
  # Management
  # ============================================================

  management:

    endpoints:
      web:
        exposure:
          include:
            - health
            - info

    endpoint:
      health:
        show-details: always

